<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول - لوحة تحكم سند</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body class="login-body">
  <form id="loginForm" class="login-card">
    <h1>لوحة تحكم سند</h1>
    <p class="sub">سجّل الدخول لإدارة المنتجات والإعدادات</p>
    <div class="field">
      <label for="username">اسم المستخدم</label>
      <input id="username" required autocomplete="username">
    </div>
    <div class="field">
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" required autocomplete="current-password">
    </div>
    <div id="loginError" class="error-msg"></div>
    <button type="submit" class="btn btn-primary full">دخول</button>
  </form>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';

  try {
    const res = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = '/admin/';
    } else {
      errEl.textContent = data.message || 'بيانات الدخول غير صحيحة';
    }
  } catch (err) {
    errEl.textContent = 'تعذر الاتصال بالخادم';
  }
});
</script>
</body>
</html>
